# XcodeGen 規格 — CI 上用 `xcodegen generate` 生出 .xcodeproj（免本機 Mac 手建專案）。
# 第二批（2026-09-03 董事長「全部做完」令）：MWDAT 眼鏡 SDK 掛回，開發者模式 MetaAppID=0 免註冊。
name: RaybanCOO
options:
  bundleIdPrefix: com.aifactory.rayban
  deploymentTarget:
    iOS: "17.0"
packages:
  MWDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    from: 0.9.0
targets:
  RaybanCOO:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: 克拉扣
        UILaunchScreen: {}
        NSCameraUsageDescription: 用眼鏡相機拍照辨識
        NSMicrophoneUsageDescription: 用來聽你講話做語音輸入
        NSSpeechRecognitionUsageDescription: 把你的話轉成中文字
        NSBluetoothAlwaysUsageDescription: 連線眼鏡與藍牙音訊
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        RelayAuthKey: $(RELAY_AUTH_KEY)
        CFBundleURLTypes:
          - CFBundleURLSchemes: [raybancoo]
        MWDAT:
          MetaAppID: "0"            # 開發者模式（眼鏡端已開）免 Developer Center 註冊
          AppLinkURLScheme: raybancoo
          TeamID: 8WZH7F644Z
    dependencies:
      - package: MWDAT
        product: MWDATCore
      - package: MWDAT
        product: MWDATCamera
      - package: MWDAT
        product: MWDATDisplay
    settings:
      base:
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        RELAY_AUTH_KEY: ""
