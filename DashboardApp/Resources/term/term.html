<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="stylesheet" href="xterm.css">
<style>
  /* 抄自 frontend/src/index.css「xterm container」＋網頁 TerminalPage 深色卡 */
  html,body{margin:0;padding:0;height:100%;background:#1c1917;overflow:hidden;-webkit-text-size-adjust:100%;}
  #term{position:absolute;inset:0;}
  .xterm{padding:4px;}
  .xterm-viewport{-webkit-overflow-scrolling:touch !important;touch-action:pan-y !important;overflow-y:auto !important;}
  .xterm-screen{touch-action:pan-y !important;}
  .xterm-viewport::-webkit-scrollbar{width:4px;}
  #hint{position:absolute;left:12px;top:10px;color:#78716c;font:12.5px "Cascadia Mono",Menlo,monospace;pointer-events:none;}
</style>
<script src="xterm.js"></script>
<script src="addon-fit.js"></script>
</head><body>
<div id="term"></div><div id="hint">連線中…</div>
<script>
(function(){
  // 與網頁版 TerminalPage 同一組 xterm 設定（fontSize 11 / lineHeight 1.15 手機規格、同色票、convertEol、scrollback 5000）
  var term = new Terminal({
    cursorBlink: true, fontSize: 11, lineHeight: 1.15,
    fontFamily: '"Cascadia Mono", "Cascadia Code", Menlo, Consolas, "Courier New", monospace',
    fontWeight: 400, fontWeightBold: 700,
    theme: { background: '#1c1917', foreground: '#e7e5e4', cursor: '#c25628', selectionBackground: 'rgba(194,86,40,0.3)' },
    convertEol: true, scrollback: 5000, rightClickSelectsWord: true, allowProposedApi: true,
  });
  var fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(document.getElementById('term'));
  var hint = document.getElementById('hint');
  var post = function(m){ try { window.webkit.messageHandlers.term.postMessage(m); } catch(e){} };
  var doFit = function(){ try { fit.fit(); post({type:'resize', cols: term.cols, rows: term.rows}); } catch(e){} };
  setTimeout(doFit, 50);
  new ResizeObserver(doFit).observe(document.getElementById('term'));
  window.addEventListener('orientationchange', function(){ setTimeout(doFit, 120); });
  // 網頁版 _humanize：留 alt-screen、只剝滑鼠追蹤序列，人才選得到字
  var humanize = function(s){ return (s||'').replace(/\x1b\[\?(?:100[0-3]|1005|1006|1015)[hl]/g, ''); };
  var dec = new TextDecoder('utf-8');
  var b64 = function(s){ var bin = atob(s), u = new Uint8Array(bin.length); for (var i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return dec.decode(u); };
  var seen = false;
  window.termWrite = function(b){ var s = b64(b); if (!s) return; if (!seen) { seen = true; hint.style.display='none'; } term.write(humanize(s)); };
  window.termLine = function(b){ term.writeln(b64(b)); };   // 我們自己的狀態行（HTTP 模式等）
  window.termHint = function(b){ hint.textContent = b64(b); hint.style.display = seen ? 'none' : ''; };
  window.termReset = function(){ term.reset(); term.clear(); seen = false; hint.style.display=''; hint.textContent='連線中…'; };
  window.termText = function(){
    var buf = term.buffer.active, out = [];
    for (var i = 0; i < buf.length; i++) { var l = buf.getLine(i); out.push(l ? l.translateToString(true) : ''); }
    return out.join('\n').replace(/\n+$/, '');
  };
  window.termFocus = function(){ term.focus(); };
  term.onData(function(d){ post({type:'input', data: d}); });
  term.attachCustomKeyEventHandler(function(e){
    if (e.type === 'keydown' && (e.ctrlKey || e.metaKey) && !e.shiftKey && (e.key === 'c' || e.key === 'C')) {
      var sel = term.getSelection ? term.getSelection() : '';
      if (sel) { post({type:'copy', data: sel}); return false; }
    }
    return true;
  });
  post({type:'ready'});
})();
</script>
</body></html>
