# XcodeGen 規格 — AI工廠商用控制台 原生 iOS app（SwiftUI 直打 8896 API；2026-09-29 v2.0 起原生；終端機用 WKWebView 跑同一份 xterm.js）
name: AIFactoryDashboard
options:
  bundleIdPrefix: com.aifactory
  deploymentTarget:
    iOS: "16.0"
targets:
  AIFactoryDashboard:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources/term
        type: folder
        buildPhase: resources
    entitlements:
      path: AIFactoryDashboard.entitlements
      properties:
        aps-environment: production
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: AI工廠
        RelayAuthKey: $(RELAY_AUTH_KEY)
        CFBundleVersion: "7"
        CFBundleShortVersionString: "2.0"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSFaceIDUsageDescription: 使用 Face ID 解鎖控制台
        NSPhotoLibraryUsageDescription: 群聊傳送照片與影片
        UIBackgroundModes: [fetch, remote-notification]
        BGTaskSchedulerPermittedIdentifiers: [com.aifactory.dashboard.refresh]
        UIViewControllerBasedStatusBarAppearance: true
        CFBundleURLTypes:
          - CFBundleURLName: com.aifactory.dashboard
            CFBundleURLSchemes: [aifactory]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aifactory.dashboard
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
