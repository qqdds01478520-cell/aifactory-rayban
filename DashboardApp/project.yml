# XcodeGen 規格 — AI工廠商用控制台 iOS app v3.0（董事長 2026-09-29 TG10182「一律網頁版＋新功能加回去＋滿版」：WKWebView 滿版載 8896 網頁原碼，原生殼只做 Face ID／推播／觸覺／左滑返回／背景更新／分享派工）
name: AIFactoryDashboard
options:
  bundleIdPrefix: com.aifactory
  deploymentTarget:
    iOS: "16.0"
targets:
  AIFactoryDashboard:
    type: application
    platform: iOS
    sources:
      - Sources
    entitlements:
      path: AIFactoryDashboard.entitlements
      properties:
        aps-environment: production
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: AI工廠
        RelayAuthKey: $(RELAY_AUTH_KEY)
        CFBundleVersion: "9"
        CFBundleShortVersionString: "3.0"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSFaceIDUsageDescription: 使用 Face ID 解鎖控制台
        NSPhotoLibraryUsageDescription: 群聊傳送照片與影片
        UIBackgroundModes: [fetch, remote-notification]
        BGTaskSchedulerPermittedIdentifiers: [com.aifactory.dashboard.refresh]
        UIViewControllerBasedStatusBarAppearance: true
        CFBundleURLTypes:
          - CFBundleURLName: com.aifactory.dashboard
            CFBundleURLSchemes: [aifactory]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aifactory.dashboard
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
