# Codemagic CI — 雲端編譯 + iPhone 模擬器逐頁截圖（免本機 Mac、免 Apple 付費簽署）。
# 放 repo 根，不需 GitHub workflow scope。在 codemagic.io 用「自訂來源」貼公開 repo 網址即可連，
# 免 GitHub 帳號授權（repo 是公開的）。真 relay 金鑰在 Codemagic 環境變數 RELAY_AUTH_KEY(secret) 設，不進 repo。
workflows:
  ios-screenshots:
    name: iOS 編譯＋逐頁截圖
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
      vars:
        BUNDLE_ID: "com.aifactory.rayban.RaybanCOO"
      # 截圖 build 不需 relay 金鑰：YouTube 未配金鑰時自動退成真實熱門預設清單（可點播）。
      # 正式機注入 RelayAuthKey 後即改用即時搜尋。
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
    scripts:
      - name: 安裝 XcodeGen
        script: brew install xcodegen
      - name: 生成 Xcode 專案
        script: xcodegen generate
      - name: 編譯（模擬器，未簽署）
        script: |
          set -e
          xcodebuild \
            -project RaybanCOO.xcodeproj \
            -scheme RaybanCOO \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            RELAY_AUTH_KEY="${RELAY_AUTH_KEY:-}" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: 開模擬器＋逐頁截圖
        script: |
          set -e
          # 找一台可用的 iPhone 模擬器（Codemagic mac 預裝）
          DEVICE=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone 1[5-9][^(]*\(([0-9A-F-]{36})\)' | grep -oE '[0-9A-F-]{36}')
          if [ -z "$DEVICE" ]; then
            DEVICE=$(xcrun simctl list devices available | grep -m1 -oE '\(([0-9A-F-]{36})\)' | tr -d '()')
          fi
          echo "模擬器 UDID=$DEVICE"
          xcrun simctl boot "$DEVICE" || true
          # 等模擬器完全開機（不只 boot 指令回傳）
          xcrun simctl bootstatus "$DEVICE" -b || sleep 10
          APP=$(find build -name "RaybanCOO.app" -type d | head -1)
          echo "APP=$APP"
          xcrun simctl install "$DEVICE" "$APP"
          # 寫進 Codemagic 保證會發佈的 CM_EXPORT_DIR（該目錄內容一定被收成 artifacts）
          # 絕對路徑避免 simctl io NSCocoaError code 4；再複製一份到 shots/ 雙保險
          OUT="${CM_EXPORT_DIR:-${CM_BUILD_DIR:-$PWD}/export}"
          SHOTS="${CM_BUILD_DIR:-$PWD}/shots"
          mkdir -p "$OUT" "$SHOTS"
          echo "OUT=$OUT  SHOTS=$SHOTS"
          i=1
          for TAB in youtube maps telegram travel mirror; do
            xcrun simctl terminate "$DEVICE" "$BUNDLE_ID" 2>/dev/null || true
            xcrun simctl launch "$DEVICE" "$BUNDLE_ID" -startTab "$TAB"
            sleep 10
            xcrun simctl io "$DEVICE" screenshot --type=png "$OUT/0${i}_${TAB}.png"
            cp "$OUT/0${i}_${TAB}.png" "$SHOTS/0${i}_${TAB}.png" || true
            echo "已截：0${i}_${TAB}.png"
            i=$((i+1))
          done
          # 加截：掃描菜單成品（翻好的中文菜單畫面）
          xcrun simctl terminate "$DEVICE" "$BUNDLE_ID" 2>/dev/null || true
          xcrun simctl launch "$DEVICE" "$BUNDLE_ID" -startTab travel -travelFeature menu -menuDemo
          sleep 14
          xcrun simctl io "$DEVICE" screenshot --type=png "$OUT/05_menuscan.png"
          cp "$OUT/05_menuscan.png" "$SHOTS/05_menuscan.png" || true
          echo "已截：05_menuscan.png"
          # 董事長令 2026-09-03：每個旅遊功能頁都要截圖（menu 已在 05）
          i=6
          for FEAT in guide plan transit talk money diary look; do
            xcrun simctl terminate "$DEVICE" "$BUNDLE_ID" 2>/dev/null || true
            xcrun simctl launch "$DEVICE" "$BUNDLE_ID" -startTab travel -travelFeature "$FEAT"
            sleep 10
            N=$(printf "%02d" "$i")
            xcrun simctl io "$DEVICE" screenshot --type=png "$OUT/${N}_${FEAT}.png"
            cp "$OUT/${N}_${FEAT}.png" "$SHOTS/${N}_${FEAT}.png" || true
            echo "已截：${N}_${FEAT}.png"
            i=$((i+1))
          done
          echo "截圖完成："; ls -la "$OUT"
    artifacts:
      - $CM_EXPORT_DIR/*.png
      - shots/*.png
  ios-adhoc:
    name: iOS 正式簽署 Ad Hoc IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
      groups:
        - ios_signing
      vars:
        BUNDLE_ID: "com.aifactory.rayban.RaybanCOO"
        TEAM_ID: "8WZH7F644Z"
    scripts:
      - name: 安裝 XcodeGen＋生成專案
        script: |
          brew install xcodegen
          xcodegen generate
      - name: 憑證進鑰匙圈＋放描述檔
        script: |
          set -e
          echo "$CM_CERT_P12_B64" | base64 --decode > /tmp/cert.p12
          keychain initialize
          keychain add-certificates --certificate /tmp/cert.p12 --certificate-password "$CM_CERT_PASSWORD"
          PROFILES_HOME="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_HOME"
          echo "$CM_PROFILE_B64" | base64 --decode > "$PROFILES_HOME/RaybanCOO_AdHoc.mobileprovision"
          security find-identity -v /Users/builder/Library/codemagic-cli-tools/keychains/*.keychain-db || true
      - name: Archive＋匯出 Ad Hoc IPA
        script: |
          set -e
          xcodebuild -project RaybanCOO.xcodeproj -scheme RaybanCOO -sdk iphoneos -configuration Release archive \
            -archivePath build/RaybanCOO.xcarchive \
            RELAY_AUTH_KEY="${RELAY_AUTH_KEY:-}" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="RaybanCOO AdHoc"
          cat > /tmp/export.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>ad-hoc</string>
          <key>teamID</key><string>8WZH7F644Z</string>
          <key>signingStyle</key><string>manual</string>
          <key>provisioningProfiles</key><dict>
          <key>com.aifactory.rayban.RaybanCOO</key><string>RaybanCOO AdHoc</string>
          </dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/RaybanCOO.xcarchive -exportPath export_ipa -exportOptionsPlist /tmp/export.plist
          ls -la export_ipa
    artifacts:
      - export_ipa/*.ipa
