# Codemagic CI — 雲端編譯 + iPhone 模擬器逐頁截圖（免本機 Mac、免 Apple 付費簽署）。
# 放 repo 根，不需 GitHub workflow scope。在 codemagic.io 用「自訂來源」貼公開 repo 網址即可連，
# 免 GitHub 帳號授權（repo 是公開的）。真 relay 金鑰在 Codemagic 環境變數 RELAY_AUTH_KEY(secret) 設，不進 repo。
workflows:
  ios-screenshots:
    name: iOS 編譯＋逐頁截圖
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
      vars:
        BUNDLE_ID: "com.aifactory.rayban.RaybanCOO"
      # RELAY_AUTH_KEY 在 Codemagic UI 設為 secret；沒設就空字串，UI 照樣截得到圖（顯示空狀態）。
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
    scripts:
      - name: 安裝 XcodeGen
        script: brew install xcodegen
      - name: 生成 Xcode 專案
        script: xcodegen generate
      - name: 編譯（模擬器，未簽署）
        script: |
          set -e
          xcodebuild \
            -project RaybanCOO.xcodeproj \
            -scheme RaybanCOO \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            RELAY_AUTH_KEY="${RELAY_AUTH_KEY:-}" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: 開模擬器＋逐頁截圖
        script: |
          set -e
          # 找一台可用的 iPhone 模擬器（Codemagic mac 預裝）
          DEVICE=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone 1[5-9][^(]*\(([0-9A-F-]{36})\)' | grep -oE '[0-9A-F-]{36}')
          if [ -z "$DEVICE" ]; then
            DEVICE=$(xcrun simctl list devices available | grep -m1 -oE '\(([0-9A-F-]{36})\)' | tr -d '()')
          fi
          echo "模擬器 UDID=$DEVICE"
          xcrun simctl boot "$DEVICE" || true
          # 等模擬器完全開機（不只 boot 指令回傳）
          xcrun simctl bootstatus "$DEVICE" -b || sleep 10
          APP=$(find build -name "RaybanCOO.app" -type d | head -1)
          echo "APP=$APP"
          xcrun simctl install "$DEVICE" "$APP"
          # 用絕對路徑，避免 simctl io 解析相對路徑時找不到資料夾（NSCocoaError code 4）
          SHOTS="${CM_BUILD_DIR:-$PWD}/shots"
          mkdir -p "$SHOTS"
          echo "SHOTS=$SHOTS"
          i=1
          for TAB in youtube maps telegram; do
            xcrun simctl terminate "$DEVICE" "$BUNDLE_ID" 2>/dev/null || true
            xcrun simctl launch "$DEVICE" "$BUNDLE_ID" -startTab "$TAB"
            sleep 10
            xcrun simctl io "$DEVICE" screenshot --type=png "$SHOTS/0${i}_${TAB}.png"
            echo "已截：0${i}_${TAB}.png"
            i=$((i+1))
          done
          echo "截圖完成："; ls -la "$SHOTS"
          # 雙保險：把三張圖上傳臨時圖床，URL 印進 log 供 COO 從 Windows 直接下載
          # （Codemagic artifact 面板偶爾收不到，改走圖床最穩）
          echo "===UPLOAD_START==="
          for f in "$SHOTS"/01_youtube.png "$SHOTS"/02_maps.png "$SHOTS"/03_telegram.png; do
            base=$(basename "$f")
            URL=$(curl -sf -A "coo-ci" -F "file=@${f}" https://0x0.st 2>/dev/null)
            if [ -z "$URL" ]; then
              URL=$(curl -sf --upload-file "$f" "https://transfer.sh/${base}" 2>/dev/null)
            fi
            echo "UPLOADED ${base} => ${URL:-UPLOAD_FAILED}"
          done
          echo "===UPLOAD_END==="
    artifacts:
      - shots/*.png
      - $CM_BUILD_DIR/shots/*.png
